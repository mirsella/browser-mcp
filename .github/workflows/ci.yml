name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: cargo fmt --check
      - run: cargo test --all-targets
      - run: bun test tests/plugin.test.ts
      - run: cargo clippy --all-targets -- -D warnings
      - name: Prepare real browser routing
        run: |
          chrome_version=155.0.8059.39
          curl --fail --location --silent --show-error \
            "https://storage.googleapis.com/chrome-for-testing-public/${chrome_version}/linux64/chrome-linux64.zip" \
            --output "$RUNNER_TEMP/chrome-linux64.zip"
          unzip -q "$RUNNER_TEMP/chrome-linux64.zip" -d "$RUNNER_TEMP"
          # Ubuntu's policy blocks user namespaces for downloaded Chrome binaries.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          "$RUNNER_TEMP/chrome-linux64/chrome" --version
          timeout 30s "$RUNNER_TEMP/chrome-linux64/chrome" --headless=new \
            --no-first-run --no-default-browser-check \
            --user-data-dir="$RUNNER_TEMP/chrome-preflight" --dump-dom about:blank \
            > "$RUNNER_TEMP/chrome-preflight.html"
          echo "OPENCODE_BROWSER_EXECUTABLE=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"
          bunx chrome-devtools-mcp@1.6.0 --help >/dev/null
      - name: Test real browser routing
        run: xvfb-run -a cargo test --release --test e2e -- --ignored --nocapture --test-threads=1
      - name: Check package versions
        run: test "$(node -p 'require("./package.json").version')" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: node scripts/stage-native.mjs
      - run: npm pack --dry-run --ignore-scripts
      - name: Test packed OpenCode plugin export
        run: |
          tarball=$(npm pack --json --ignore-scripts | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => { const parsed = JSON.parse(data); const item = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0]; console.log(item.filename) })')
          mkdir /tmp/browser-mcp-package-test
          cd /tmp/browser-mcp-package-test
          bun init -y
          bun add "$GITHUB_WORKSPACE/$tarball"
          bun -e 'import plugin from "@mirsella/opencode-browser-mcp/server"; if (plugin.id !== "@mirsella/opencode-browser-mcp" || typeof plugin.server !== "function") process.exit(1)'
          ./node_modules/@mirsella/opencode-browser-mcp/vendor/browser-mcp --version
      - name: Checksum release package
        run: sha256sum mirsella-opencode-browser-mcp-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            mirsella-opencode-browser-mcp-*.tgz
            SHA256SUMS
          if-no-files-found: error
