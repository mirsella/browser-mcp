[package]
name = "browser-mcp"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
description = "Session-isolated browser automation over MCP and Chrome DevTools Protocol"
license = "MIT"
repository = "https://github.com/mirsella/browser-mcp"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "3.1", default-features = false, features = ["client", "server", "transport-async-rw", "transport-child-process", "transport-io"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
